<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simpsons Cluedo - 2º ESO</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        :root { --bg-color: #0b0b0b; --text-color: #fff; --accent-color: #ffd90f; --panel-bg: #1a1a1a; --border-color: #444; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Lobby */
        #lobby-screen { position: fixed; inset: 0; background: #000; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; justify-content: center; max-width: 600px;}
        input { padding: 12px; border-radius: 5px; border: none; width: 250px; font-size: 1rem; color: #000; text-align: center; }
        
        /* Layout & Board Zoom Fix */
        #game-container { display: none; width: 100vw; height: 100vh; display: flex; flex-direction: row; }
        #board-area { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #222; padding: 20px; box-sizing: border-box; overflow: hidden; }
        
        #board-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: calc((100vh - 40px) * 24 / 25); 
            aspect-ratio: 24 / 25; 
            background-image: url('tablero.jpg'); 
            background-size: 100% 100%; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8); 
        }
        
        #grid-overlay { display: grid; grid-template-columns: repeat(24, 1fr); grid-template-rows: repeat(25, 1fr); width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 20; }
        .cell { border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; }
        .cell:hover { background: rgba(255, 217, 15, 0.2); }
        
        /* --- FIX: ROOM LABELS --- */
        #room-labels-layer { position: absolute; inset: 0; pointer-events: none; z-index: 30; } /* High z-index to be above grid */
        .room-label { 
            position: absolute; 
            color: #fff; 
            font-size: 0.75rem; 
            font-weight: bold; 
            text-transform: uppercase; 
            background: rgba(0, 0, 0, 0.7); 
            padding: 4px 8px; 
            border-radius: 4px; 
            border: 1px solid var(--accent-color);
            transform: translate(-50%, -50%);
            white-space: nowrap;
            pointer-events: none;
        }

        /* UI Sidebar */
        #ui-sidebar { width: 380px; min-width: 380px; background: var(--panel-bg); border-left: 2px solid var(--border-color); padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .section { background: #111; padding: 12px; border-radius: 8px; border: 1px solid #333; }
        .section h3 { margin-top: 0; margin-bottom: 8px; color: var(--accent-color); font-size: 0.85em; text-transform: uppercase; }

        /* Tokens */
        .player-token { width: 3.8%; height: 3.8%; position: absolute; transform: translate(-50%, -50%); transition: 0.4s ease-out; border-radius: 50%; border: 2px solid #fff; background-size: cover; z-index: 25; box-shadow: 0 4px 8px #000; }
        
        /* Moving Dice */
        #dice-container { font-size: 4em; text-align: center; color: var(--accent-color); display: flex; justify-content: center; gap: 10px; }
        .die { display: inline-block; }
        @keyframes roll {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; font-weight: bold; }
        #log { height: 100px; background: #000; overflow-y: auto; font-size: 0.8em; padding: 10px; border: 1px solid #333; color: #0f0; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="lobby-screen">
        <h1 style="color:var(--accent-color);">SIMPSONS CLUEDO</h1>
        <div id="setup-step">
            <input type="text" id="room-id" placeholder="Enter Room Name">
            <button onclick="joinRoom()" style="width:auto; background:var(--accent-color);">Enter</button>
            <button onclick="resetRoomFromLobby()" style="width:auto; background:#e74c3c; color:white;">Reset</button>
        </div>
        <div id="char-step" style="display:none;">
            <h3>Select your character:</h3>
            <div id="char-btns" class="btn-group"></div>
        </div>
    </div>

    <div id="game-container">
        <div id="board-area">
            <div id="board-wrapper">
                <div id="room-labels-layer"></div>
                <div id="grid-overlay"></div>
            </div>
        </div>

        <div id="ui-sidebar">
            <h2 id="turn-indicator" style="text-align:center; margin:0; font-size:1.2em;">Loading...</h2>
            
            <div class="section">
                <h3>Current Location</h3>
                <div id="loc-tracker" style="font-size: 1.2em; color: var(--accent-color); font-weight: 900; text-align: center;">Hallway</div>
            </div>

            <div class="section">
                <h3>Movement</h3>
                <div id="dice-container"><span class="die" id="die1">⚀</span><span class="die" id="die2">⚀</span></div>
                <button id="roll-btn" onclick="triggerDiceRoll()">Roll Dice</button>
            </div>

            <div class="section">
                <h3>Actions</h3>
                <select id="guess-suspect"></select>
                <select id="guess-weapon"></select>
                <button onclick="makeSuggestion()" style="background:#3498db; color:white;">Make Suggestion</button>
                <button onclick="makeAccusation()" style="background:#e74c3c; color:white;">Final Accusation</button>
                <button id="end-turn-btn" onclick="endTurn()" style="background:#444; color:white;">End Turn</button>
            </div>

            <div class="section">
                <h3>Notebook</h3>
                <div id="notebook-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.75em;"></div>
            </div>

            <div id="log"></div>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCxN2d4RZyt9Q5JOKZxT7pJ5NBirAoxEn4", databaseURL: "https://cluedo-821bd-default-rtdb.firebaseio.com", projectId: "cluedo-821bd" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const diceUnicode = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
    const characters = [
        { name: "Homer", color: "#ffd90f", startX: 2, startY: 2, img: 'homer.png' },
        { name: "Moe", color: "#4dabf7", startX: 11, startY: 3, img: 'moe.png' },
        { name: "Duffman", color: "#ff6b6b", startX: 20, startY: 2, img: 'duffman.png' },
        { name: "Mr Burns", color: "#51cf66", startX: 3, startY: 12, img: 'burns.png' }
    ];

    const gameData = {
        suspects: ["Homer", "Moe", "Duffman", "Mr Burns", "Krusty", "Smithers"],
        weapons: ["Poisoned Donut", "Saxophone", "Knife", "Gun", "Candelabrum", "Book"],
        rooms: ["Cafeteria", "Lab", "Art's class", "2ºA", "Teacher's lounge", "ICT room", "Gym", "Library", "English department", "Hall", "Bathroom", "Cinema room", "Annex"]
    };

    // Coordinates mapping
    const roomZones = [
        { name: "Cafeteria", x1: 0, y1: 0, x2: 4, y2: 6 },
        { name: "Lab", x1: 6, y1: 0, x2: 11, y2: 5 },
        { name: "Art's class", x1: 13, y1: 0, x2: 17, y2: 5 },
        { name: "2ºA", x1: 19, y1: 0, x2: 23, y2: 6 },
        { name: "Teacher's lounge", x1: 0, y1: 8, x2: 7, y2: 16 },
        { name: "ICT room", x1: 13, y1: 8, x2: 17, y2: 14 },
        { name: "Gym", x1: 19, y1: 9, x2: 23, y2: 15 },
        { name: "Library", x1: 0, y1: 18, x2: 4, y2: 24 },
        { name: "English department", x1: 6, y1: 18, x2: 12, y2: 24 },
        { name: "Hall", x1: 14, y1: 17, x2: 23, y2: 24 },
        { name: "Bathroom", x1: 15, y1: 9, x2: 17, y2: 12 },
        { name: "Cinema room", x1: 9, y1: 8, x2: 11, y2: 12 },
        { name: "Annex", x1: 21, y1: 10, x2: 23, y2: 14 }
    ];

    let roomPath = ""; let myChar = ""; let localState = {}; let currentRoll = 0; let hasMovedThisTurn = false;

    function joinRoom() {
        const id = document.getElementById('room-id').value.trim();
        if (!id) return;
        roomPath = 'cluedo_rooms/' + id;
        document.getElementById('setup-step').style.display = 'none';
        document.getElementById('char-step').style.display = 'block';
        db.ref(roomPath).on('value', (snap) => {
            localState = snap.val() || {};
            if (localState.started) startGameUI();
            else renderLobby();
        });
    }

    function resetRoomFromLobby() {
        const id = document.getElementById('room-id').value.trim();
        if (id && confirm("Delete room data?")) db.ref('cluedo_rooms/' + id).remove();
    }

    function renderLobby() {
        const area = document.getElementById('char-btns');
        area.innerHTML = "";
        characters.forEach(c => {
            const isTaken = localState.players && localState.players[c.name];
            const btn = document.createElement('button');
            btn.textContent = c.name;
            btn.style.background = c.color;
            btn.disabled = isTaken || myChar !== "";
            btn.onclick = () => { myChar = c.name; db.ref(roomPath + '/players/' + c.name).set({ eliminated: false }); };
            area.appendChild(btn);
        });
        if (Object.keys(localState.players || {}).length >= 2 && myChar && !localState.started) {
            const start = document.createElement('button');
            start.textContent = "START GAME"; start.style.background = "#2ecc71";
            start.onclick = hostInit; area.appendChild(start);
        }
    }

    function hostInit() {
        const solution = { suspect: gameData.suspects[0], weapon: gameData.weapons[0], room: gameData.rooms[0] };
        db.ref(roomPath).update({ started: true, turn: 0, solution, positions: characters.reduce((acc, c) => { acc[c.name] = {x: c.startX, y: c.startY}; return acc; }, {}), logs: ["Game Started"] });
    }

    function startGameUI() {
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        setupDropdowns();
        renderBoard();
        drawRoomLabels();
        updateUI();
    }

    // --- NEW: ROOM LABELS ---
    function drawRoomLabels() {
        const layer = document.getElementById('room-labels-layer');
        layer.innerHTML = "";
        roomZones.forEach(z => {
            const label = document.createElement('div');
            label.className = 'room-label';
            label.textContent = z.name;
            // Center calculation
            label.style.left = (((z.x1 + z.x2 + 1) / 2) * (100 / 24)) + "%";
            label.style.top = (((z.y1 + z.y2 + 1) / 2) * (100 / 25)) + "%";
            layer.appendChild(label);
        });
    }

    function triggerDiceRoll() {
        if (characters[localState.turn].name !== myChar || hasMovedThisTurn) return;
        const d1 = document.getElementById('die1'); const d2 = document.getElementById('die2');
        d1.style.animation = d2.style.animation = "roll 0.2s infinite";
        setTimeout(() => {
            d1.style.animation = d2.style.animation = "none";
            const r1 = Math.floor(Math.random()*6)+1; const r2 = Math.floor(Math.random()*6)+1;
            d1.textContent = diceUnicode[r1-1]; d2.textContent = diceUnicode[r2-1];
            currentRoll = r1 + r2;
            addLog(`${myChar} rolled a ${currentRoll}`);
        }, 1000);
    }

    function renderBoard() {
        const grid = document.getElementById('grid-overlay');
        grid.innerHTML = "";
        for (let i = 0; i < 24 * 25; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const x = i % 24; const y = Math.floor(i / 24);
            cell.onclick = () => handleMove(x, y);
            grid.appendChild(cell);
        }
        updateTokens();
    }

    function updateTokens() {
        document.querySelectorAll('.player-token').forEach(t => t.remove());
        characters.forEach(c => {
            const pos = localState.positions?.[c.name];
            if (!pos) return;
            const token = document.createElement('div');
            token.className = 'player-token';
            token.style.left = `calc(${(pos.x + 0.5)} * (100% / 24))`;
            token.style.top = `calc(${(pos.y + 0.5)} * (100% / 25))`;
            token.style.backgroundImage = `url('${c.img}')`;
            token.style.backgroundColor = c.color;
            document.getElementById('board-wrapper').appendChild(token);
            
            // --- FIX: RECOGNIZE ROOM ---
            if (c.name === myChar) {
                const room = roomZones.find(z => pos.x >= z.x1 && pos.x <= z.x2 && pos.y >= z.y1 && pos.y <= z.y2);
                document.getElementById('loc-tracker').textContent = room ? room.name : "Hallway";
            }
        });
    }

    function handleMove(x, y) {
        if (currentRoll === 0) return;
        const pos = localState.positions[myChar];
        if (Math.abs(pos.x - x) + Math.abs(pos.y - y) <= currentRoll) {
            db.ref(roomPath + '/positions/' + myChar).set({ x, y });
            currentRoll = 0; hasMovedThisTurn = true;
        }
    }

    function makeSuggestion() {
        const room = document.getElementById('loc-tracker').textContent;
        if (room === "Hallway") return alert("Must be in a room to suggest!");
        addLog(`${myChar} suggests ${document.getElementById('guess-suspect').value} in the ${room}`);
    }

    function makeAccusation() {
        const room = document.getElementById('loc-tracker').textContent;
        if (room === "Hallway") return alert("Must be in a room to accuse!");
        const s = document.getElementById('guess-suspect').value;
        if (s === localState.solution.suspect) alert("CORRECT!"); else alert("WRONG!");
    }

    function endTurn() {
        db.ref(roomPath).update({ turn: (localState.turn + 1) % 4 });
        hasMovedThisTurn = false; currentRoll = 0;
    }

    function updateUI() {
        const isMyTurn = characters[localState.turn].name === myChar;
        document.getElementById('turn-indicator').textContent = isMyTurn ? "🚨 YOUR TURN" : `${characters[localState.turn].name}'s Turn`;
        document.getElementById('log').innerHTML = (localState.logs || []).slice().reverse().map(l => `<div>> ${l}</div>`).join('');
        renderNotebook();
    }

    function setupDropdowns() {
        const s = document.getElementById('guess-suspect'); const w = document.getElementById('guess-weapon');
        if (s.options.length > 0) return;
        gameData.suspects.forEach(i => s.innerHTML += `<option>${i}</option>`);
        gameData.weapons.forEach(i => w.innerHTML += `<option>${i}</option>`);
    }

    function renderNotebook() {
        const container = document.getElementById('notebook-container');
        if (container.children.length > 0) return;
        [...gameData.suspects, ...gameData.weapons, ...gameData.rooms].forEach(item => {
            container.innerHTML += `<div><input type="checkbox"> ${item}</div>`;
        });
    }

    function addLog(msg) {
        const logs = [...(localState.logs || []), msg];
        if (logs.length > 10) logs.shift();
        db.ref(roomPath + '/logs').set(logs);
    }
</script>
</body>
</html>
